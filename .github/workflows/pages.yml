# Deploys the React UI to GitHub Pages at https://<user>.github.io/bicopilot/
# The UI talks to the API at VITE_API_URL (set it as a repository variable, e.g. https://bi-copilot.onrender.com).
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd web && npm ci && npm run build
        env:
          VITE_BASE: /bicopilot/
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://bicopilot.onrender.com' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
