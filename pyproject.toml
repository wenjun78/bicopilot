[project]
name = "bicopilot"
version = "0.1.0"
description = "Intelligent BI copilot: natural language to governed SQL, multi-agent (LangGraph), hybrid RAG over a semantic layer, A2A endpoint"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "sqlglot>=25,<32",
    "pyyaml>=6,<7",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "langgraph>=0.2,<2",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "pandas>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pypdf>=4,<6",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
milvus = ["pymilvus[milvus_lite]>=2.4,<3"]
rerank = ["flashrank>=0.2,<1"]
redis = ["redis>=5,<7"]
all = ["pymilvus[milvus_lite]>=2.4,<3", "flashrank>=0.2,<1", "redis>=5,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "B008", "E501"]  # formatter owns line length; long SQL/prompt strings are deliberate

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
