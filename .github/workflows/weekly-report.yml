# Process automation: every Monday the reporting agent asks the copilot six questions over A2A and
# commits the briefing to reports/. Runs on the zero-infra path (SQLite, deterministic compiler) so it
# needs no secrets; set LLM_PROVIDER/LLM_API_KEY as repository secrets to use a model instead.
name: Weekly report

on:
  schedule:
    - cron: "17 1 * * 1"  # Mondays 01:17 UTC (09:17 Kuala Lumpur)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python data/generate.py
      - name: Start the copilot API
        run: |
          HOST=127.0.0.1 PORT=8080 nohup python -m bicopilot > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: Reporting agent compiles the briefing over A2A
        run: |
          mkdir -p reports
          python agents/reporting_agent.py --base http://127.0.0.1:8080 --out "reports/$(date -u +%Y-%m-%d).md"
          cp "reports/$(date -u +%Y-%m-%d).md" reports/latest.md
      - name: Commit the report
        run: |
          git config user.name "wenjun78"
          git config user.email "151641864+wenjun78@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Weekly sales briefing $(date -u +%Y-%m-%d) (reporting agent over A2A)"
          git push
